plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Cobblemon is pulled from Modrinth's maven, so the build works on any machine (and on GitHub)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modCompileOnly fabricApi.module('fabric-api-base', project.fabric_api_version)
    modCompileOnly fabricApi.module('fabric-rendering-v1', project.fabric_api_version)

    // Never bundled: the player already has Cobblemon (and its Kotlin runtime) installed
    modCompileOnly "maven.modrinth:cobblemon:${project.cobblemon_modrinth_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    // Also build cobblemon-shid-<version>-sources.jar
    withSourcesJar()
}

// Ship the license inside both jars
jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
sourcesJar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
